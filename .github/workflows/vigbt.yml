name: VIGBT Core

on:
  push:
    paths: ["VIGBT/**", ".github/workflows/vigbt.yml"]
  pull_request:
    paths: ["VIGBT/**", ".github/workflows/vigbt.yml"]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: VIGBT/tools/check_version.sh

  linux:
    runs-on: ubuntu-latest
    container: swift:5.10
    defaults:
      run:
        working-directory: VIGBT
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: VIGBT
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios-app:
    runs-on: macos-14
    defaults:
      run:
        working-directory: VIGBT/App
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for device (unsigned)
        run: |
          xcodebuild -project VIGBT.xcodeproj -scheme VIGBT \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          exit ${PIPESTATUS[0]}
