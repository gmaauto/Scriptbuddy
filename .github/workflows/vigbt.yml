name: VIGBT CI

# Runs on every push or pull request that touches VIGBT, and on demand (Actions tab → VIGBT CI → Run workflow).
# The repository is public, so GitHub-hosted Linux and macOS runners are free.
on:
  push:
    paths: ["VIGBT/**", ".github/workflows/vigbt.yml"]
  pull_request:
    paths: ["VIGBT/**", ".github/workflows/vigbt.yml"]
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: vigbt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version numbers agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: VIGBT/tools/check_version.sh

  linux:
    name: Core tests (Linux) + Monte Carlo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.0
    defaults:
      run:
        working-directory: VIGBT
    steps:
      - uses: actions/checkout@v5
      - run: swift build
      - run: swift test
      - name: Monte Carlo validation (SPEC §12)
        run: swift run -c release vigbt-montecarlo --shots 200000 --seed 2026

  macos:
    name: Core tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: VIGBT
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version && swift --version
      - run: swift test

  ios-app:
    name: iPhone app builds
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: VIGBT/App
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      # The full log goes to an artifact; the job log shows only errors and the result, so problems are easy to find.
      - name: Build for the iOS Simulator
        run: |
          set +e
          xcodebuild -project VIGBT.xcodeproj -scheme VIGBT \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1
          status=$?
          grep -E "error:|warning: .*VIGBT/App" simulator-build.log | sort -u | head -200
          tail -3 simulator-build.log
          exit $status
      - name: Build for iPhone, Release (the "VIGBT Device" scheme, unsigned)
        run: |
          set +e
          xcodebuild -project VIGBT.xcodeproj -scheme "VIGBT Device" -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build > device-build.log 2>&1
          status=$?
          grep -E "error:" device-build.log | sort -u | head -200
          tail -3 device-build.log
          exit $status
      # Field-test .ipa for installing from Windows with AltStore or Sideloadly (docs/device-testing.md).
      # Unsigned: the sideloading tool signs it with the tester's own Apple ID. Pro is unlocked in this build
      # only (VIGBT_FIELD_TEST), because local StoreKit testing works only when the app is run from Xcode.
      - name: Build field-test .ipa (unsigned, for sideloading)
        run: |
          set +e
          xcodebuild -project VIGBT.xcodeproj -scheme "VIGBT Device" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath fieldtest \
            CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=VIGBT_FIELD_TEST \
            build > fieldtest-build.log 2>&1
          status=$?
          grep -E "error:" fieldtest-build.log | sort -u | head -200
          tail -3 fieldtest-build.log
          [ $status -eq 0 ] || exit $status
          set -e
          version=$(tr -d '[:space:]' < ../VERSION)
          rm -rf Payload && mkdir Payload
          cp -R fieldtest/Build/Products/Release-iphoneos/VIGBT.app Payload/
          zip -qry "VIGBT-${version}-fieldtest.ipa" Payload
          ls -lh "VIGBT-${version}-fieldtest.ipa"
          echo "IPA_NAME=VIGBT-${version}-fieldtest" >> "$GITHUB_ENV"
      - name: Upload field-test .ipa
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.IPA_NAME }}
          path: VIGBT/App/*-fieldtest.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-build-logs
          path: VIGBT/App/*-build.log
          if-no-files-found: ignore
