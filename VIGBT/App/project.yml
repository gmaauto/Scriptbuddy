# Generate the Xcode project with XcodeGen:  brew install xcodegen && cd VIGBT/App && xcodegen
name: VIGBT
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  VIGBTCore:
    path: ..

targets:
  VIGBT:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: VIGBTCore
        product: VIGBTCore
    # Bundle ID and signing team come from Config/Signing.xcconfig, which includes your own
    # Config/Local.xcconfig (git-ignored) when it exists. See docs/device-testing.md.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: VIGBT
        MARKETING_VERSION: "0.16.0"
        CURRENT_PROJECT_VERSION: "24"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: VIGBT
      configs:
        # Debug: unoptimised, so SwiftUI previews work in Xcode. Pixel loops are about 20x slower, which
        # is fine in the Simulator; on an iPhone use the "VIGBT Device" scheme (Release) for real speed.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: VIGBT
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit, gyroscope, magnetometer, gps]
        NSCameraUsageDescription: "VIGBT films your swing at high speed to measure the ball's launch, and scans the ground to help you find your ball."
        NSMicrophoneUsageDescription: "VIGBT listens for the sound of the club striking the ball so it knows exactly when to measure the shot."
        NSLocationWhenInUseUsageDescription: "VIGBT uses your location to project where the ball landed and to guide you to it."
        NSMotionUsageDescription: "VIGBT counts your steps to keep walking directions steady when GPS is noisy."
        UIBackgroundModes: [audio, location]

schemes:
  # Simulator and SwiftUI previews (Debug, unoptimised).
  VIGBT:
    build:
      targets:
        VIGBT: all
    run:
      config: Debug
      storeKitConfiguration: Resources/VIGBT.storekit
    archive:
      config: Release
  # Testing on an iPhone: Release build, so VIGBTCore's pixel loops run at full speed at 120 fps.
  # The debugger still attaches; StoreKit uses the local test configuration (no real purchases).
  VIGBT Device:
    build:
      targets:
        VIGBT: all
    run:
      config: Release
      storeKitConfiguration: Resources/VIGBT.storekit
    archive:
      config: Release
